<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NFL Flight Paths — Walkthrough</title>
    <style>
      @font-face {
        font-family: "Big Shoulders Display";
        font-style: normal;
        font-weight: 600 800;
        font-display: swap;
        src: url("./fonts/big-shoulders-display/big-shoulders-display-latin.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("./fonts/geist/geist-variable.woff2") format("woff2-variations");
      }
      @font-face {
        font-family: "Departure Mono";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("./fonts/departure-mono/departure-mono.woff2") format("woff2");
      }

      html, body {
        margin: 0;
        padding: 0;
        background: #0f0d0a;
        overflow: hidden;
      }

      #walkthrough {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0f0d0a;
        font-family: "Geist", system-ui, sans-serif;
        color: #e8e2d0;
      }

      /* Scene clip hosts — sub-comps mount their content inside these */
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #intro-host { z-index: 3; }
      #footage-video {
        z-index: 1;
        background: #0f0d0a;
        object-fit: cover;
        display: block;
      }
      #outro-host { z-index: 4; }
    </style>
  </head>
  <body>
    <div
      id="walkthrough"
      data-composition-id="walkthrough"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="19"
    >
      <!-- ── INTRO sub-comp ── 0.0 – 2.4s ──────────────────── -->
      <div
        id="intro-host"
        class="clip scene"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="2.4"
        data-track-index="1"
      ></div>

      <!-- ── FOOTAGE — captured app video, 2.0–17.4s ───────── -->
      <!-- CDP screencast starts right at beat-sheet t=0, so the source has
           no pre-roll — data-media-start is 0. -->
      <video
        id="footage-video"
        class="clip scene"
        data-start="2"
        data-duration="15.4"
        data-media-start="0"
        data-track-index="2"
        src="footage.mp4"
        muted
        playsinline
      ></video>

      <!-- ── OUTRO sub-comp ── 17.0 – 19.0s ────────────────── -->
      <div
        id="outro-host"
        class="clip scene"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="17"
        data-duration="2"
        data-track-index="3"
      ></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // Root composer timeline — orchestrates only the clip-level crossfades
      // between scenes. Per-scene entrance animations live in their sub-comp
      // timelines (compositions/intro.html, compositions/outro.html), which
      // the runtime auto-nests via window.__timelines["intro" | "outro"].
      const tl = gsap.timeline({ paused: true });

      // Initial visibility — set inside the timeline (clip elements may not
      // exist in DOM until their data-start window).
      tl.set("#intro-host", { opacity: 1 }, 0);
      tl.set("#footage-video", { opacity: 0 }, 0);
      tl.set("#outro-host", { opacity: 0 }, 0);

      // Crossfade: intro → footage (1.8 – 2.2s)
      tl.to("#intro-host", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 1.8);
      tl.to("#footage-video", { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 1.8);

      // Crossfade: footage → outro (16.8 – 17.2s)
      tl.to("#footage-video", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 16.8);
      tl.to("#outro-host", { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 16.8);

      window.__timelines = window.__timelines || {};
      window.__timelines["walkthrough"] = tl;
    </script>
  </body>
</html>
