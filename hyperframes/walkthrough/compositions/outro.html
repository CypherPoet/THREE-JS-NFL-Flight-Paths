<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Walkthrough — Outro</title>
  </head>
  <body>
    <template id="outro-template">
      <div
        data-composition-id="outro"
        data-width="1920"
        data-height="1080"
      >
        <style>
          .outro-root {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Geist", system-ui, sans-serif;
            color: var(--fg-muted);
          }

          .outro-card {
            position: absolute;
            inset: 0;
            background: var(--card-vignette);
          }

          .outro-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            text-align: center;
          }

          .outro-glyph {
            width: 96px;
            height: 96px;
            will-change: transform, opacity;
          }
          .outro-glyph circle.outer {
            fill: none;
            stroke: var(--accent);
            stroke-width: 2;
            opacity: 0.7;
          }
          .outro-glyph circle.inner {
            fill: var(--bg-card);
            stroke: var(--fg);
            stroke-width: 2;
          }
          .outro-glyph path.arc {
            fill: none;
            stroke: var(--fg);
            stroke-width: 2.5;
            stroke-linecap: round;
          }
          .outro-glyph circle.dot {
            fill: var(--fg);
          }

          .outro-accent {
            width: 220px;
            height: 1px;
            background: linear-gradient(
              90deg,
              rgba(200, 144, 96, 0) 0%,
              rgba(200, 144, 96, 0.95) 50%,
              rgba(200, 144, 96, 0) 100%
            );
            transform-origin: center;
          }

          .outro-url {
            font-family: "Geist", system-ui, sans-serif;
            font-weight: 600;
            font-size: 52px;
            letter-spacing: 0.04em;
            color: var(--fg);
            text-shadow: 0 0 22px rgba(255, 242, 196, 0.22);
          }
          .outro-url .slash {
            color: var(--accent);
            margin: 0 4px;
          }

          .outro-sub {
            font-family: "Departure Mono", ui-monospace, monospace;
            font-size: 22px;
            letter-spacing: 0.34em;
            color: var(--accent);
            text-transform: uppercase;
          }
        </style>

        <div class="outro-root">
          <div class="outro-card"></div>
          <div class="outro-content">
            <svg class="outro-glyph" viewBox="0 0 100 100">
              <circle class="outer" cx="50" cy="50" r="46" />
              <circle class="inner" cx="50" cy="50" r="34" />
              <path
                class="arc"
                d="M 18 50 Q 50 18 82 50"
                pathLength="100"
                stroke-dasharray="100"
                stroke-dashoffset="0"
              />
              <circle class="dot" cx="82" cy="50" r="3.5" />
            </svg>
            <div class="outro-accent"></div>
            <div class="outro-url">
              github.com<span class="slash">/</span>CypherPoet<span class="slash">/</span>THREE-JS-NFL-Flight-Paths
            </div>
            <div class="outro-sub">Built with Three.js</div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            const tl = gsap.timeline({ paused: true });

            tl.fromTo(
              ".outro-glyph",
              { opacity: 0, scale: 0.55, rotation: -90, transformOrigin: "center" },
              {
                opacity: 1,
                scale: 1,
                rotation: 0,
                duration: 0.85,
                ease: "back.out(1.6)",
              },
              0.15,
            );
            tl.fromTo(
              ".outro-accent",
              { scaleX: 0, opacity: 0 },
              { scaleX: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
              0.35,
            );
            tl.fromTo(
              ".outro-url",
              { y: 28, opacity: 0 },
              { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" },
              0.45,
            );
            tl.fromTo(
              ".outro-sub",
              { y: 14, opacity: 0 },
              { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" },
              0.65,
            );

            // Final fade is the one allowed exit (last scene only — see design.md).
            tl.to(".outro-root", { opacity: 0, duration: 0.5, ease: "power2.in" }, 2.5);

            window.__timelines = window.__timelines || {};
            window.__timelines["outro"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
