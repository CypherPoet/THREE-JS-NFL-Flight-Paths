name: Test

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs when a new commit lands on the same PR/branch — the
# previous one's results are about to be obsolete anyway. `main` runs are not
# cancelled; they complete in commit order so a regression points at the
# commit that caused it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
