<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efe9dd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10131a" media="(prefers-color-scheme: dark)" />
    <script>
      // Resolve theme before paint to avoid a flash.
      (function () {
        const saved = localStorage.getItem("nfl-flight-paths-theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const theme = saved || (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23efe7d4' stroke='%236c6354' stroke-width='1.5'/%3E%3Cpath d='M8 14 Q14 8 22 12 M6 18 Q12 22 26 20' stroke='%236c6354' stroke-width='1' fill='none' opacity='.6'/%3E%3C/svg%3E"
    />
    <title>NFL Flight Paths · 2026 Season</title>
    <meta
      name="description"
      content="An interactive Three.js globe of every NFL team's 2025 flight schedule — great-circle road-trip arcs, team-coloured, total miles tallied."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght,wdth@12..96,300..800,75..100&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene-canvas"></canvas>

      <header class="topbar">
        <div class="topbar__brand">
          <div class="topbar__mark" aria-hidden="true"></div>
          <div class="topbar__titles">
            <h1>NFL Flight Paths</h1>
            <p class="topbar__season" id="season-sublabel">
              2026 Season · Confirmed slate
            </p>
          </div>
          <div class="season-switch" role="tablist" aria-label="Season">
            <button
              type="button"
              class="season-switch__button"
              data-season="2026"
              data-active="true"
              role="tab"
            >
              2026
            </button>
            <button
              type="button"
              class="season-switch__button"
              data-season="2025"
              data-active="false"
              role="tab"
            >
              2025
            </button>
          </div>
        </div>
        <div class="topbar__meta">
          <span class="metric">
            <span class="metric__label">Selected miles</span>
            <span class="metric__value" id="selected-miles">—</span>
          </span>
          <span class="metric">
            <span class="metric__label">League total</span>
            <span class="metric__value" id="league-miles">—</span>
          </span>
          <button
            type="button"
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Toggle dark mode"
            title="Toggle dark mode"
          >
            <svg
              class="theme-toggle__icon theme-toggle__icon--sun"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4" />
            </svg>
            <svg
              class="theme-toggle__icon theme-toggle__icon--moon"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8z" />
            </svg>
          </button>
        </div>
      </header>

      <aside class="panel" id="team-panel">
        <div class="panel__head">
          <h2>Teams</h2>
          <div class="panel__actions">
            <button
              type="button"
              class="panel__button"
              id="select-all"
              title="Show every team"
            >
              All
            </button>
            <button
              type="button"
              class="panel__button"
              id="select-none"
              title="Clear selection"
            >
              None
            </button>
          </div>
        </div>
        <ol class="team-list" id="team-list"></ol>
      </aside>

      <div class="hint" id="hint">
        Drag to rotate · scroll to zoom · hover a stadium · click a team to isolate
      </div>

      <div class="legend" id="legend">
        <span class="legend__dot legend__dot--home"></span>
        <span class="legend__text">Home stadium</span>
        <span class="legend__dot legend__dot--away"></span>
        <span class="legend__text">Away venue</span>
      </div>

      <div class="loading" id="loading">
        <div class="loading__bar"></div>
        <span>Loading globe</span>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
